<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#171429" />
    <title>Hello, World!</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      * { box-sizing: border-box; }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        overflow: hidden;
        color: #fbfaff;
        background: #171429;
      }

      .orb {
        position: fixed;
        width: 32rem;
        aspect-ratio: 1;
        border-radius: 50%;
        filter: blur(2px);
        opacity: .75;
        animation: float 12s ease-in-out infinite alternate;
      }

      .orb-one { top: -14rem; left: -10rem; background: #7658ff; }
      .orb-two { right: -12rem; bottom: -15rem; background: #ff4faf; animation-delay: -5s; }

      main {
        position: relative;
        width: min(92vw, 760px);
        padding: clamp(2rem, 8vw, 5.5rem);
        text-align: center;
        background: rgba(27, 23, 49, .65);
        border: 1px solid rgba(255, 255, 255, .18);
        border-radius: 32px;
        box-shadow: 0 28px 80px rgba(0, 0, 0, .32);
        backdrop-filter: blur(22px);
        animation: appear .8s cubic-bezier(.2, .8, .2, 1) both;
      }

      nav {
        display: flex;
        justify-content: center;
        gap: .5rem;
        margin-bottom: clamp(2rem, 5vw, 3.5rem);
      }

      nav a {
        padding: .6rem .9rem;
        border-radius: 999px;
        color: #dcd6ef;
        font-size: .9rem;
        font-weight: 700;
        text-decoration: none;
        transition: background .2s ease, color .2s ease;
      }

      nav a:hover, nav a[aria-current="page"] { background: rgba(255,255,255,.14); color: #fff; }

      .eyebrow {
        display: inline-flex;
        gap: .5rem;
        align-items: center;
        margin: 0 0 1.4rem;
        color: #d9d1ff;
        font-size: .78rem;
        font-weight: 800;
        letter-spacing: .16em;
        text-transform: uppercase;
      }

      .dot {
        width: .55rem;
        height: .55rem;
        border-radius: 50%;
        background: #81f4c6;
        box-shadow: 0 0 16px #81f4c6;
      }

      h1 {
        margin: 0;
        font-size: clamp(3.5rem, 12vw, 7.5rem);
        line-height: .95;
        letter-spacing: -.075em;
        background: linear-gradient(120deg, #fff 15%, #c9bdff 52%, #ffb6df 90%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }

      p {
        max-width: 33rem;
        margin: 1.6rem auto 0;
        color: #d4cee7;
        font-size: clamp(1rem, 2vw, 1.2rem);
        line-height: 1.7;
      }

      .sparkle {
        display: block;
        margin-top: 2.5rem;
        color: #fff;
        font-size: 1.7rem;
        animation: twinkle 1.8s ease-in-out infinite alternate;
      }

      @keyframes appear {
        from { opacity: 0; transform: translateY(24px) scale(.98); }
        to { opacity: 1; transform: translateY(0) scale(1); }
      }
      @keyframes float {
        to { transform: translate(4rem, 3rem) scale(1.12); }
      }
      @keyframes twinkle {
        to { transform: scale(1.25) rotate(12deg); text-shadow: 0 0 25px #fff; }
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; }
      }
    </style>
  </head>
  <body>
    <div class="orb orb-one"></div>
    <div class="orb orb-two"></div>
    <main>
      <nav aria-label="Primary navigation">
        <a href="hello-world.html" aria-current="page">Home</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
      </nav>
      <p class="eyebrow"><span class="dot"></span> A fresh beginning</p>
      <h1>Hello, World!</h1>
      <p>Your next great idea has officially entered the chat. Make something wonderful.</p>
      <span class="sparkle" aria-hidden="true">✦</span>
    </main>
  </body>
</html>
