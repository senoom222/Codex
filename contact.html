<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#171429" />
    <title>Contact | Hello, World!</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; } * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 2rem; overflow: hidden; color: #fbfaff; background: #171429; } .orb { position: fixed; width: 32rem; aspect-ratio: 1; border-radius: 50%; filter: blur(2px); opacity: .75; animation: float 12s ease-in-out infinite alternate; } .orb-one { top: -14rem; left: -10rem; background: #7658ff; } .orb-two { right: -12rem; bottom: -15rem; background: #ff4faf; animation-delay: -5s; }
      main { position: relative; width: min(92vw, 760px); padding: clamp(2rem,7vw,4.5rem); text-align: center; background: rgba(27,23,49,.65); border: 1px solid rgba(255,255,255,.18); border-radius: 32px; box-shadow: 0 28px 80px rgba(0,0,0,.32); backdrop-filter: blur(22px); animation: appear .8s cubic-bezier(.2,.8,.2,1) both; } nav { display:flex; justify-content:center; gap:.5rem; margin-bottom:clamp(2rem,5vw,3.5rem); } nav a { padding:.6rem .9rem; border-radius:999px; color:#dcd6ef; font-size:.9rem; font-weight:700; text-decoration:none; transition:background .2s ease,color .2s ease; } nav a:hover,nav a[aria-current="page"] { background:rgba(255,255,255,.14); color:#fff; }
      .eyebrow { margin:0 0 1.2rem; color:#d9d1ff; font-size:.78rem; font-weight:800; letter-spacing:.16em; text-transform:uppercase; } h1 { margin:0; font-size:clamp(3.2rem,10vw,6rem); line-height:1; letter-spacing:-.065em; background:linear-gradient(120deg,#fff 15%,#c9bdff 52%,#ffb6df 90%); -webkit-background-clip:text; background-clip:text; color:transparent; } p { max-width:34rem; margin:1.5rem auto 0; color:#d4cee7; font-size:clamp(1rem,2vw,1.15rem); line-height:1.7; } .email { display:inline-block; margin-top:2.2rem; padding:.95rem 1.35rem; border-radius:999px; background:linear-gradient(110deg,#8b6cff,#ee6ab4); color:#fff; font-weight:800; text-decoration:none; box-shadow:0 12px 28px rgba(130,91,255,.3); transition:transform .2s ease,box-shadow .2s ease; } .email:hover { transform:translateY(-3px); box-shadow:0 17px 32px rgba(130,91,255,.42); }
      @keyframes appear { from { opacity:0; transform:translateY(24px) scale(.98); } to { opacity:1; transform:none; } } @keyframes float { to { transform:translate(4rem,3rem) scale(1.12); } } @media (prefers-reduced-motion: reduce) { *,*::before,*::after { animation-duration:.01ms !important; animation-iteration-count:1 !important; } }
    </style>
  </head>
  <body>
    <div class="orb orb-one"></div><div class="orb orb-two"></div>
    <main>
      <nav aria-label="Primary navigation"><a href="hello-world.html">Home</a><a href="about.html">About</a><a href="contact.html" aria-current="page">Contact</a></nav>
      <p class="eyebrow">Say hello</p><h1>Let's connect.</h1>
      <p>Have an idea, a question, or just a friendly hello? My inbox is always open.</p>
      <a class="email" href="mailto:hello@example.com">hello@example.com</a>
    </main>
  </body>
</html>
